[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-for-maya"
version = "0.7.0"
description = "MCP server giving AI agents spatial awareness of Autodesk Maya scenes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["maya", "mcp", "autodesk", "3d", "animation", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    # D-105/D-099: fastmcp 4.x migration (R25 spike adjudicated — the
    # earlier camelCase attribution was root-cause-corrected: the real
    # reds were .fn/ToolResult import/annotation-kwarg renames).
    # Ceiling stays at the next major: upstream releases policy allows
    # breaking changes on minors, so a minor bump must not slip in via
    # this pin alone — it goes through a migration PR. Dual anchors:
    # CI red histories #18/#36 (post-correction reading) + the upstream
    # "minor may break" releases policy
    # (https://github.com/jlowin/fastmcp/releases).
    "fastmcp>=4.0.0,<5.0.0",
    "platformdirs>=4.0.0",
    "psutil>=5.9.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.1.0",
    "mypy==2.3.1",
    "mypy-baseline==0.7.4",
    "types-maya-strict==2025.0.6",
    "types-psutil==7.2.2.20260906",
    "PySide6",
    "types-PySide6==6.10.3.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
mcp-for-maya = "maya_mcp_server.__main__:main"
maya-mcp-server = "maya_mcp_server.__main__:main"

[project.urls]
Homepage = "https://github.com/Xxx91n/mcp-for-maya"
Repository = "https://github.com/Xxx91n/mcp-for-maya"
Issues = "https://github.com/Xxx91n/mcp-for-maya/issues"

[tool.hatch.build.targets.sdist]
# .github/ holds GitHub-facade source assets (~2.5MB) — dead weight in the
# source distribution. Wheel stays unchanged (it only ships src/ anyway).
exclude = [".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/maya_mcp_server"]

[tool.pytest.ini_options]
# D-111 warnings ratchet: warnings escalate to errors. The exemption list
# is a ratchet — entries may only be REMOVED once their trigger fires,
# never added silently (each carries its removal trigger + evidence).
filterwarnings = [
    "error",
    # NOTE (D-105): both adjudicated AuthlibDeprecationWarning
    # exemptions were REMOVED by the fastmcp 4.x migration — their
    # registered trigger fired: fastmcp 4.0.10's auth providers moved
    # to joserfc and `import fastmcp` emits no authlib warnings
    # (authlib.jose survival probe result: absent). Re-add narrowly if
    # a future resolution resurrects the warning.
    # The second adjudicated exemption — requests' urllib3/chardet
    # pin-mismatch notice — lives in tests/conftest.py as a CONDITIONAL
    # runtime filter: requests is not a declared dependency (it only
    # exists when a transitive resolution pulls it in), and a
    # config-level exemption against a module the locked env does not
    # ship crashes pytest's filter import at collection. Conftest's
    # find_spec guard is the honest equivalent of the spec's narrow
    # exemption: active when requests is present, inert when absent.
]

# D-117 redeemed (T-27b): trigger verified 2026-09-27 — uv.lock pins
# pytest 9.1.1 and every CI cell installs the same lock via
# `uv sync --frozen`, so all 4 cells resolve pytest >=9.1. The
# warnings-as-errors native ratchet slot is now armed: the suite
# fails when any warning escapes the filterwarnings=error wall
# (collection-phase warnings included).
max_warnings = 0

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "mayapy: requires a real Maya interpreter (mayapy) — local manual tier, never CI",
    "gui: requires a live Maya GUI session (MAYA_MCP_GUI_ADDR or :7001) — manual tier, real asserts (D-049a)",
    "human_verify: manual checklist skeletons — prints steps, never asserts, always skips (D-049a)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["maya_mcp_server"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# The maya stub must mirror Maya's camelCase API surface verbatim
"tests/maya_stub/**" = ["N802", "N803", "N806", "N815", "F401"]
# Showcase scene generators: Maya-domain idioms — module aliases (K/MV),
# uppercase dim locals (H/R/L/PY/DY), terse one-line guards
".github/assets-src/**" = ["N803", "N806", "N812", "E701", "E741"]

[tool.mypy]
python_version = "3.10"
strict = true
# ratchet pawls: unused ignores/config entries must surface immediately
warn_unused_ignores = true
warn_unused_configs = true
