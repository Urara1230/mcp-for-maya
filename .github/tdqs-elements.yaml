{
  "schema": "tdqs-elements/1",
  "note": "JSON-syntax YAML (YAML 1.2 is a strict superset of JSON): parseable by both yaml.safe_load and json.loads — stdlib-only CI consumption. This file is the SINGLE SOURCE for TDQS disclosure elements; consumed by .github/scripts/check_tdqs_disclosure.py. Asserts element presence, NOT literal wording — wording freedom stays inside the line.",
  "legislation": "tool descriptions must disclose the mandatory elements below; the checker asserts element presence, never literal wording",
  "decisions": ["D-172", "D-173", "D-174", "D-175", "D-180", "D-181", "D-190", "D-195", "D-196"],
  "assert_semantics": {
    "any": "element satisfied if ANY regex in the list matches the tool description/docstring",
    "all": "element satisfied only if EVERY literal string in the list appears in the description",
    "on_failure": "CI failure message MUST name the missing element id",
    "change_review": "edits to this file require explicit PR review (prevents 'rewording slips deleting the assertion')",
    "polarity_aware": "mutation-class existence assertions MUST be polarity-aware (D-180): a match whose preceding clause text carries a negation cue does not satisfy the element; negated-only matches are WARN-level during the observation period. Direction limit (D-190 3): the guard is mandatory only on mutation-class existence assertions whose pattern set is purely positive (current sole instance: camera_orbit/mutation_side_effects) — negation-form pattern elements stay unguarded and are protected by positive_exemptions instead, otherwise the two rules cancel each other out. Enforcement is by PINNING the guarded set (LEGISLATED_GUARDED in tests/test_check_tdqs_disclosure.py), not by a pattern-purity lint — mounting the guard on a negation-form element yields matched=True and zero warnings, so the assertion layer cannot detect it; see the polarity guard's known blind spot",
    "coverage_floor": "every tool in pipeline.TOOL_ANNOTATIONS must appear in 'tools' OR in 'coverage_exemptions' with a non-empty reason; absence is a CI error, never a silent skip (D-195 1). The reverse direction is asserted too, so a stale entry cannot rot unnoticed.",
    "derivable_minimum_set": "for a tool carrying a full 'tools' entry two elements are derivable from its signature: a session_key parameter implies session_prerequisite, and membership in a sibling family implies boundary_line + boundary_targets_named. Enforced immediately for new or modified tools. Legacy derivation debt is NOT held in coverage_exemptions: a tool missing a derivable element still carries a full 'tools' entry, so the coverage rule forbids exempting it (covered-and-exempt is itself an error). That debt lives in the DERIVATION_BASELINE constant in .github/scripts/check_tdqs_disclosure.py, which fails when the set grows and also when it shrinks (D-195 2). The sibling-family table lives in that same file as a code constant (D-195 3).",
    "coverage_exemptions": "grandfather register for tools that predate the floor entirely, i.e. tools with no 'tools' entry at all. Each entry needs a reason and a due. The due is enforced mechanically rather than by prose: the checker parses it as a dotted version and tiers it against the version in pyproject.toml (D-204): equal to the due emits a WARNING naming the tool (ripe — the release landing ON the deadline stays green), strictly past the due emits an ERROR naming the tool and its five D-168\u00a74 elements (a gate_authority countersignature distinct from the debt_owner per D-176, an event-anchored rather than calendar expiry, the per-row renewal cap of 2, a re-validated reason, and the waiver lane closing after gate review), and an unreadable version stays a WARNING rather than a silent pass. So an exemption cannot quietly become open-ended (D-195 4). A due that is not a dotted numeric version is an error, because an unparseable deadline is no deadline. This register is a different ledger from the derivation baseline; see derivable_minimum_set.",
    "positive_exemptions": "element-level list of legitimate negation-form disclosure phrases; a cue inside the match clause that belongs to one of these phrases is forgiven (D-190 2). Without this list, widening the guard to a negation-form pattern element makes every correct negative disclosure self-reject — 'not idempotent' always carries the cue 'not'"
  },
  "tools": {
    "execute_code": {
      "file": "src/maya_mcp_server/server.py",
      "tier": "P0",
      "required_elements": [
        {
          "id": "scope_arbitrary_code",
          "why": "disclose that arbitrary code runs in the session",
          "any": ["(?i)arbitrary", "(?i)any\\s+(valid\\s+)?python\\s+code", "(?i)arbitrary\\s+(MEL|python)"]
        },
        {
          "id": "full_session_privileges",
          "why": "privilege level disclosure",
          "any": ["(?i)full\\s+(session\\s+)?(privileges|permissions)", "(?i)same\\s+privileges\\s+as", "(?i)user'?s?\\s+(Maya\\s+)?(session\\s+)?privileges", "(?i)with\\s+full\\s+.*(privileges|permissions)"]
        },
        {
          "id": "irreversible",
          "why": "undo-semantics disclosure",
          "any": ["(?i)irreversible", "(?i)not\\s+undo", "(?i)cannot be undone", "(?i)no\\s+undo", "(?i)not\\s+reversible", "(?i)can'?t be undone"]
        },
        {
          "id": "result_type_envelope",
          "why": "return shape depends on result_type",
          "any": ["result_type"]
        },
        {
          "id": "session_prerequisite",
          "why": "requires a live/connected session before use",
          "any": ["(?i)(active|connected|open|live|established)\\s+(Maya\\s+)?session", "(?i)list_sessions", "(?i)session_key", "(?i)requires\\s+a\\s+session"]
        }
      ]
    },
    "scene_validate": {
      "file": "src/maya_mcp_server/scene_tools.py",
      "tier": "P0",
      "required_elements": [
        {
                  "id": "read_only_disclosure",
                  "why": "read-only check disclosure — the description must state it does not modify the scene (real API has no auto_fix parameter; revised from autofix_two_state/autofix_mutation by the polarity rule)",
                  "any": [
                            "(?i)read[-\\s]?only",
                            "(?i)non-destructive",
                            "(?i)does not (modify|mutate|change|alter)",
                            "(?i)cannot (modify|mutate|repair|change|alter)",
                            "(?i)without\\s+[^\\n]{0,40}(mutat|modif|alter)"
                  ]
        },
        {
                  "id": "repair_redirect",
                  "why": "routes callers needing automated repair to the tool that owns mutation — scene_plan with auto_fix (redirect target names, not a mutation claim)",
                  "all": [
                            "scene_plan",
                            "auto_fix"
                  ]
        },
        {
                  "id": "no_mutation_no_undo",
                  "why": "no-mutation implies no-undo consequence disclosed (revised from irreversible_when_mutating by the polarity rule)",
                  "any": [
                            "(?i)non-destructive[^\\n]{0,120}(no|without)[^\\n]{0,40}(undo|rollback)",
                            "(?i)(no|without)[^\\n]{0,40}(undo|rollback)\\s+checkpoint",
                            "(?i)no\\s+undo\\s+rollback",
                            "(?i)does not (create|require)[^\\n]{0,40}(undo|rollback|checkpoint)"
                  ]
        },
        {
                  "id": "session_prerequisite",
                  "why": "requires a live/connected session",
                  "any": [
                            "(?i)(active|connected|open|live|established)\\s+(Maya\\s+)?session",
                            "(?i)session_key",
                            "(?i)requires\\s+a\\s+session"
                  ]
        },
        {
                  "id": "boundary_line",
                  "why": "one-way disambiguation marker (also a P1 scene_* member)",
                  "any": [
                            "Boundary:"
                  ]
        },
        {
                  "id": "boundary_targets_named",
                  "why": "names sibling tools — vs scene_review (full audit) / scene_assert (expected values)",
                  "all": [
                            "scene_review",
                            "scene_assert"
                  ]
        }
      ]
    },
    "write_module": {
      "file": "src/maya_mcp_server/server.py",
      "tier": "P0",
      "required_elements": [
        {
          "id": "session_prerequisite",
          "why": "requires a live/connected session",
          "any": ["(?i)(active|connected|open|live|established)\\s+(Maya\\s+)?session", "(?i)session_key", "(?i)requires\\s+a\\s+session"]
        },
        {
          "id": "overwrite_or_persistence_semantics",
          "why": "what gets destroyed / whether the module persists — lifecycle disclosure",
          "any": ["(?i)overwrite", "(?i)in-memory", "(?i)virtual", "(?i)not\\s+persist", "(?i)does not persist", "(?i)teardown", "(?i)removed on"]
        },
        {
          "id": "boundary_execute_code",
          "why": "when/when-not boundary vs execute_code (reusable module vs one-shot execution)",
          "all": ["execute_code"]
        }
      ]
    },
    "scene_snapshot": {
      "file": "src/maya_mcp_server/scene_tools.py",
      "tier": "P1",
      "required_elements": [
        {"id": "boundary_line", "why": "one-way disambiguation marker", "any": ["Boundary:"]},
        {"id": "boundary_targets_named", "why": "names sibling tools", "all": ["scene_inspect", "scene_nodes"]}
      ]
    },
    "scene_inspect": {
      "file": "src/maya_mcp_server/scene_tools.py",
      "tier": "P1",
      "required_elements": [
        {"id": "boundary_line", "why": "one-way disambiguation marker", "any": ["Boundary:"]},
        {"id": "boundary_targets_named", "why": "names sibling tools", "all": ["scene_snapshot", "scene_describe"]}
      ]
    },
    "scene_measure": {
      "file": "src/maya_mcp_server/scene_tools.py",
      "tier": "P1",
      "required_elements": [
        {"id": "session_prerequisite", "why": "requires a live/connected session before use", "any": ["(?i)(active|connected|open|live|established)\\s+(Maya\\s+)?session", "(?i)session_key", "(?i)requires\\s+a\\s+session"]},
        {"id": "boundary_line", "why": "one-way disambiguation marker", "any": ["Boundary:"]},
        {"id": "boundary_targets_named", "why": "names sibling tools — per-object inspect vs whole-scene overview vs expected-value check", "all": ["scene_inspect", "scene_snapshot", "scene_assert"]}
      ]
    },
    "scene_nodes": {
      "file": "src/maya_mcp_server/introspect_tools.py",
      "tier": "P1",
      "required_elements": [
        {"id": "boundary_line", "why": "one-way disambiguation marker", "any": ["Boundary:"]},
        {"id": "boundary_targets_named", "why": "names sibling tools", "all": ["scene_snapshot", "scene_describe"]}
      ]
    },
    "scene_describe": {
      "file": "src/maya_mcp_server/introspect_tools.py",
      "tier": "P1",
      "required_elements": [
        {"id": "boundary_line", "why": "one-way disambiguation marker", "any": ["Boundary:"]},
        {"id": "boundary_targets_named", "why": "names sibling tools", "all": ["scene_nodes", "scene_inspect"]}
      ]
    },
    "scene_assert": {
      "file": "src/maya_mcp_server/scene_tools.py",
      "tier": "P1",
      "required_elements": [
        {"id": "boundary_line", "why": "one-way disambiguation marker", "any": ["Boundary:"]},
        {"id": "boundary_targets_named", "why": "names sibling tools", "all": ["scene_validate"]}
      ]
    },
    "scene_review": {
      "file": "src/maya_mcp_server/scene_tools.py",
      "tier": "P1",
      "required_elements": [
        {"id": "boundary_line", "why": "one-way disambiguation marker", "any": ["Boundary:"]},
        {"id": "boundary_targets_named", "why": "names sibling tools", "all": ["scene_validate", "scene_aesthetics"]}
      ]
    },
    "scene_plan": {
      "file": "src/maya_mcp_server/scene_tools.py",
      "tier": "P1",
      "required_elements": [
        {"id": "boundary_line", "why": "one-way disambiguation marker", "any": ["Boundary:"]},
        {"id": "boundary_targets_named", "why": "names sibling tools", "all": ["scene_review"]}
      ]
    },
    "scene_aesthetics": {
      "file": "src/maya_mcp_server/scene_tools.py",
      "tier": "P1",
      "required_elements": [
        {"id": "boundary_line", "why": "one-way disambiguation marker", "any": ["Boundary:"]},
        {"id": "boundary_targets_named", "why": "names sibling tools", "all": ["scene_review"]}
      ]
    },
    "camera_orbit": {
      "file": "src/maya_mcp_server/scene_tools.py",
      "tier": "P1",
      "required_elements": [
        {
                  "id": "mutation_side_effects",
                  "why": "creates a camera and animation curves and marks the scene dirty — mutation side effects must be disclosed (polarity_aware: a negated claim must not satisfy; pure-positive pattern set, the only guarded element under the direction limit)",
                  "polarity_aware": true,
                  "positive_exemptions": [
                            "not idempotent",
                            "non-idempotent"
                  ],
                  "any": [
                            "(?i)creat(e|es|ed|ing)\\s+a\\s+(new\\s+)?camera",
                            "(?i)animation\\s+curves?",
                            "(?i)(marks?|flags?)\\s+(the\\s+)?scene\\s+(as\\s+)?dirty",
                            "mark_dirty"
                  ]
        },
        {
                  "id": "non_idempotent",
                  "why": "repeat calls add another camera — call multiplicity disclosed",
                  "any": [
                            "(?i)not\\s+idempotent",
                            "(?i)non-idempotent",
                            "(?i)each\\s+(call|invocation)\\s+(adds|creates|produces)",
                            "(?i)repeat(ed)?\\s+calls?\\s+(create|add|produce)",
                            "(?i)additional\\s+camera"
                  ]
        },
        {
                  "id": "session_prerequisite",
                  "why": "requires a live/connected session",
                  "any": [
                            "(?i)(active|connected|open|live|established)\\s+(Maya\\s+)?session",
                            "(?i)session_key",
                            "(?i)requires\\s+a\\s+session"
                  ]
        },
        {
                  "id": "center_json_semantics",
                  "why": "center arrives as a JSON-encoded string, not a structured array parameter",
                  "any": [
                            "(?i)JSON\\s+(string|array)",
                            "(?i)\\[x,\\s*y,\\s*z\\]"
                  ]
        },
        {
                  "id": "boundary_line",
                  "why": "one-way disambiguation marker (the one-way convention)",
                  "any": [
                            "Boundary:"
                  ]
        },
        {
                  "id": "boundary_targets_named",
                  "why": "names sibling tool — vs camera_create (static shot-type framing)",
                  "all": [
                            "camera_create"
                  ]
        }
      ]
    }
  },
  "coverage_exemptions": {
    "add_session": {"reason": "session-management surface; takes no session_key (T-R44-04 dry-run), so no session_prerequisite is derivable", "due": "0.7.0"},
    "asset_import": {"reason": "session-scoped importer \u2014 it DOES take session_key, so the full floor applies; this is the first legacy gap scheduled to be filled", "due": "0.7.0"},
    "asset_search": {"reason": "host-side index search with no Maya session involved; takes no session_key (T-R44-04 dry-run)", "due": "0.7.0"},
    "camera_create": {"reason": "sibling of camera_orbit, which is covered; camera_create itself has no entry yet", "due": "0.7.0"},
    "list_sessions": {"reason": "enumerates sessions and takes no session_key by design (T-R44-04 dry-run), so the session_prerequisite half of the floor does not apply; the boundary half is not written yet", "due": "0.7.0"},
    "maya_setup_guide": {"reason": "connection-management surface; takes no session_key (T-R44-04 dry-run), so no session_prerequisite is derivable", "due": "0.7.0"},
    "scene_checkpoint": {"reason": "mutation-class tool with no mutation_side_effects / non_idempotent assertions yet", "due": "0.7.0"},
    "scene_checkpoint_list": {"reason": "session-scoped; the sibling floor against scene_checkpoint / scene_rollback is not written yet", "due": "0.7.0"},
    "scene_export": {"reason": "currently a single-member surface, so the boundary half is not derivable yet; mutation and overwrite assertions are absent", "due": "0.7.0"},
    "scene_render_preview": {"reason": "GUI-only tool; the sibling floor against scene_viewport_snapshot is not written yet", "due": "0.7.0"},
    "scene_rollback": {"reason": "mutation-class tool with no mutation_side_effects / non_idempotent assertions yet", "due": "0.7.0"},
    "scene_viewport_snapshot": {"reason": "GUI-only tool; the sibling floor against scene_render_preview is not written yet", "due": "0.7.0"}
  }
}
