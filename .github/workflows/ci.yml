name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly floating-resolution canary (D-112 dual-track): latest-in-range
    # resolution is tested here instead of the PR matrix — a red run means
    # dependency drift broke us (the D-100④ re-review trigger) and is also
    # the carrier for the D-099 "test fresh resolution when fastmcp 4.x
    # lands" obligation.
    - cron: "37 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff budget gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge-base resolution for the assets guard (D-113)
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: ruff check (JSON report)
        run: uvx ruff@0.16.8 check . --output-format=json --exit-zero > ruff-report.json
      - name: compare vs frozen budget
        run: python .github/scripts/check_ruff_budget.py ruff-report.json .github/ruff-baseline.json
      - name: assets append-only guard (D-113)
        env:
          GUARD_BEFORE: ${{ github.event.before }}
        run: python .github/scripts/check_assets_append_only.py
      - name: monolith line budget (D-125)
        run: python .github/scripts/check_monolith_budget.py
      - name: tdqs disclosure elements gate (D-175)
        run: python .github/scripts/check_tdqs_disclosure.py

      - name: llms.txt gate (D-207 2)
        run: python .github/scripts/check_llms_txt.py
      - name: version consistency gate (D-207 9)
        run: python .github/scripts/check_version_consistency.py
      - name: gate-registry consistency (D-215; warning period, not yet blocking)
        # Ships as ::warning:: for one observation period per D-215 4. It exits
        # 0 while warning; flip to hard red once the registry has landed and the
        # first normal PR cycle on top of it has completed, in a commit that
        # also carries the coverage self-check. Do not leave it warning.
        run: python .github/scripts/check_gate_registry.py
      - name: pre-commit fallback (all files)
        run: |
          pip install pre-commit
          pre-commit run --all-files

  mypy:
    name: mypy baseline gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: install (locked)
        # D-112: uv sync --frozen installs the committed uv.lock, not a
        # floating resolution. sync has no --system mode (uv#9399) — the
        # project env is .venv and commands run via `uv run`. Windows
        # first-check if sync misbehaves: UV_PROJECT_ENVIRONMENT.
        run: uv sync --frozen
      - name: mypy | mypy-baseline filter
        run: |
          rc=0
          uv run python -m mypy src/ > mypy-report.txt || rc=$?
          if [ "$rc" -gt 1 ]; then cat mypy-report.txt; exit "$rc"; fi
          uv run mypy-baseline filter < mypy-report.txt

  test:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: install (locked)
        run: uv sync --frozen
      - name: pytest
        run: uv run python -m pytest -q

  drift:
    name: resolution-drift canary (D-112)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: fresh floating resolution
        run: uv lock --upgrade # ignores the committed lock; newest-in-range wins
      - name: install + test on floating resolution
        run: |
          uv sync
          uv run python -m pytest -q
      - name: resolve latest tag (D-142γ probe input)
        # if:always() pairs with the probe step below — the tag must resolve
        # even when the drift leg above is already red, otherwise the probe
        # degrades to a misleading "LATEST_TAG unset" failure.
        if: always()
        id: latest-tag
        run: |
          echo "tag=$(git ls-remote --tags --sort=-v:refname origin 'refs/tags/v[0-9]*' \
            | grep -v '\^{}' | head -1 | cut -f2 | sed 's|refs/tags/||')" >> "$GITHUB_OUTPUT"
      - name: PyPI index dual-source probe (D-142γ)
        # Independent signal lane merged into the drift job (D-141 P2):
        # simple index (install-resolution truth, highest severity) and
        # project JSON info.version are both asserted against the latest
        # tag. `if: always()` keeps its verdict in the log even when the
        # drift leg above is already red — attribution aid, not a merge
        # of the two failure domains.
        if: always()
        env:
          PACKAGE: mcp-for-maya
          LATEST_TAG: ${{ steps.latest-tag.outputs.tag }}
        run: python .github/scripts/check_pypi_index.py

  drift-notify:
    # D-123: scheduled-job red only emails whoever last touched the
    # cron line — with a two-person commit base (Euiop1 + Xxx91n; 67/89 of the
    # recent window from Euiop1) that is still a structural blind spot.
    # Independent trailing job (not an if:failure() inline step) so
    # its own conclusion never masks the drift job's red.
    name: drift canary notify (D-123)
    needs: drift
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # job-level escalation only; workflow stays read-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: drift result -> issue artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_RESULT: ${{ needs.drift.result }}
          DRIFT_WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: python .github/scripts/notify_drift_canary.py

  ci:
    name: ci
    needs: [lint, mypy, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aggregate results
        run: |
          echo "lint=${{ needs.lint.result }} mypy=${{ needs.mypy.result }} test=${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = "success" && test "${{ needs.mypy.result }}" = "success" && test "${{ needs.test.result }}" = "success"
