{
  "schema": "evidence-anchor-forms/1",
  "note": "JSON-syntax YAML (YAML 1.2 superset of JSON): parseable by yaml.safe_load and json.loads — stdlib-only CI consumption. SINGLE SOURCE for evidence-pointer anchor forms, legislated by D-183 (generalizing D-082(7)); dual consumers: .github/scripts/check_evidence_anchors.py (machine) and AGENTS.md Changelog Evidence Rule (authoring template) — one source, no drift.",
  "legislation": "decision-ledger D-183 (R39 evidence-pointer discipline generalization); scoped-revises D-082(7) form detail",
  "decisions": [
    "D-082",
    "D-183"
  ],
  "anchor_forms": [
    {
      "form": "pytest_node_id",
      "priority": 1,
      "pattern": "tests/<path>::<test_id> e.g. tests/test_pipeline.py::test_audit_jsonl or ::TestClass::test_x",
      "verify": "ast-resolve the referenced test function/method",
      "why": "strongest: a renamed or deleted test breaks the pointer mechanically",
      "detect_regex": "(?<![:\\w./\\\\-])(tests[/\\\\][\\w./\\\\-]+\\.py)::([A-Za-z_]\\w*(?:::[A-Za-z_]\\w*)*)"
    },
    {
      "form": "path_symbol",
      "priority": 2,
      "pattern": "<path>::<symbol> or <path>::<Class>::<method>",
      "verify": "ast.parse — symbol must exist (def/class/method at module or class level)",
      "why": "drift-resistant: survives line-number churn",
      "detect_regex": "(?<![:\\w./\\\\-])([\\w./\\\\-]+\\.py)::([A-Za-z_]\\w*(?:::[A-Za-z_]\\w*)?)"
    },
    {
      "form": "sha_path_line",
      "priority": 3,
      "pattern": "<sha7+>:<path>:<line>",
      "verify": "structural only (hex length + path + int)",
      "why": "commit-pinned point-in-time slice (D-136 family)",
      "detect_regex": "(?<![:\\w./\\\\-])([0-9a-f]{7,40}):([\\w./\\\\-]+\\.\\w+):(\\d+)"
    },
    {
      "form": "bare_path_line",
      "priority": 4,
      "pattern": "<path>:<line>",
      "verify": "none — warn-level upgrade hint in versioned docs",
      "why": "drifts on every edit (P-03b lesion); legitimate transient form inside .scratch/ only",
      "detect_regex": "(?<![:\\w./\\\\-])([\\w./\\\\-]+\\.(?:py|md|yaml|yml|json|toml|txt|ts|js)):(\\d+)(?!\\d)"
    }
  ],
  "scan_targets": {
    "CHANGELOG.md": "most recent release section only (topmost ## [x.y.z] block)",
    "docs/adr/**": "all .md files",
    "docs/evidence/**": "all .md files — provenance JSON payloads (probe dumps, waiver lists) are exempt from form judgement"
  },
  "structured_requirements": {
    "command_evidence": "every evidence command carries the triple: environment + exit code + artifact path",
    "fixed_entries": "every CHANGELOG Fixed bullet carries the field: broken version -> fixed version"
  },
  "machine_check_boundary": "pointer reachability + structural element existence only; content truth and semantic direction stay human (fabricated flags, unrepeatable commands, inverted fix direction are not machine-detectable)",
  "levels": {
    "observation_period": "all findings ::warning::, exit 0",
    "expiry_anchor": "first release-preflight false-positive review — zero/low FP promotes missing path::symbol classes to hard; bare path:line upgrade hint stays warn permanently"
  },
  "falsification": "if FP rate >30% (dynamic names, __all__, nested symbols) the mechanism returns to manual audit sampling; if versioned-doc pointer volume <10 the hard-promotion case must re-measure decay rate"
}
